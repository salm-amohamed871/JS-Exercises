<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 36</title>
    <style>
     




h1 {
    text-align: center;
    margin-bottom: 30px;
}

label {
    font-size: 18px;
    margin-right: 15px;
}

#colorPicker {
    width: 65px;
    height: 45px;
    cursor: pointer;
    border: none;
    background: transparent;
}

#colorPerview {
    padding: 45px;
    text-align: center;
    border-radius: 15px;
    margin: 25px 0;
    font-size: 20px;
}

h2 {
    margin-bottom: 15px;
}

#colorHistory {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 25px;
}

#colorHistory li {
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 24px;
}

#clearHistory {
    background-color: #ef4444;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
}

#clearHistory:hover {
    background-color: #dc2626;
}


    </style>
</head>
<body>
    <h1>Interactive Color Picker</h1>
    <label for="choosecolor">Choose a color: </label>
    <input type="color" id="colorPicker">

    <div id="colorPerview">Color Perview</div>

    <ul id="colorHistory"></ul>

    <button id="clearHistory">Clear History</button>
    <script src="./Exercise36.js"></script>
</body>
</html>
